services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queue_metadata
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - queue-metadata-postgres:/var/lib/postgresql/data

  metadata-service:
    build:
      context: .
      dockerfile: metadata-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      METADATA_DATABASE_URL: jdbc:postgresql://postgres:5432/queue_metadata
      METADATA_DATABASE_USER: queue
      METADATA_DATABASE_PASSWORD: queue
      METADATA_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  queue-node:
    build:
      context: .
      dockerfile: queue-node/Dockerfile
    depends_on:
      metadata-service:
        condition: service_started
    environment:
      QUEUE_NODE_ID: local-node-1
      QUEUE_NODE_ENDPOINT: http://queue-node:8081
      METADATA_SERVICE_URL: http://metadata-service:8080
      QUEUE_STORAGE_ROOT: /var/lib/distributed-queue
      NODE_REGISTRATION_LEASE_DURATION: PT30S
      NODE_HEARTBEAT_DELAY: PT10S
      PROVISIONING_LEASE_DURATION: PT30S
      PROVISIONING_POLL_DELAY: PT1S
      RUNTIME_PARTITION_POLL_DELAY: PT1S
      QUEUE_MAX_MESSAGE_BYTES: 262144
      QUEUE_MAX_RETAINED_MESSAGES: 100000
      QUEUE_MAX_RETAINED_BYTES: 1073741824
      QUEUE_NODE_PORT: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    volumes:
      - queue-node-data:/var/lib/distributed-queue

  queue-node-2:
    build:
      context: .
      dockerfile: queue-node/Dockerfile
    depends_on:
      metadata-service:
        condition: service_started
    environment:
      QUEUE_NODE_ID: local-node-2
      QUEUE_NODE_ENDPOINT: http://queue-node-2:8081
      METADATA_SERVICE_URL: http://metadata-service:8080
      QUEUE_STORAGE_ROOT: /var/lib/distributed-queue
      NODE_REGISTRATION_LEASE_DURATION: PT30S
      NODE_HEARTBEAT_DELAY: PT10S
      PROVISIONING_LEASE_DURATION: PT30S
      PROVISIONING_POLL_DELAY: PT1S
      RUNTIME_PARTITION_POLL_DELAY: PT1S
      QUEUE_MAX_MESSAGE_BYTES: 262144
      QUEUE_MAX_RETAINED_MESSAGES: 100000
      QUEUE_MAX_RETAINED_BYTES: 1073741824
      QUEUE_NODE_PORT: 8081
    ports:
      - "8083:8081"
    restart: unless-stopped
    volumes:
      - queue-node-2-data:/var/lib/distributed-queue

  queue-node-3:
    build:
      context: .
      dockerfile: queue-node/Dockerfile
    depends_on:
      metadata-service:
        condition: service_started
    environment:
      QUEUE_NODE_ID: local-node-3
      QUEUE_NODE_ENDPOINT: http://queue-node-3:8081
      METADATA_SERVICE_URL: http://metadata-service:8080
      QUEUE_STORAGE_ROOT: /var/lib/distributed-queue
      NODE_REGISTRATION_LEASE_DURATION: PT30S
      NODE_HEARTBEAT_DELAY: PT10S
      PROVISIONING_LEASE_DURATION: PT30S
      PROVISIONING_POLL_DELAY: PT1S
      RUNTIME_PARTITION_POLL_DELAY: PT1S
      QUEUE_MAX_MESSAGE_BYTES: 262144
      QUEUE_MAX_RETAINED_MESSAGES: 100000
      QUEUE_MAX_RETAINED_BYTES: 1073741824
      QUEUE_NODE_PORT: 8081
    ports:
      - "8084:8081"
    restart: unless-stopped
    volumes:
      - queue-node-3-data:/var/lib/distributed-queue

  queue-gateway:
    build:
      context: .
      dockerfile: queue-gateway/Dockerfile
    depends_on:
      metadata-service:
        condition: service_started
      queue-node:
        condition: service_started
      queue-node-2:
        condition: service_started
      queue-node-3:
        condition: service_started
    environment:
      METADATA_SERVICE_URL: http://metadata-service:8080
      QUEUE_GATEWAY_PORT: 8082
      GATEWAY_CONNECT_TIMEOUT: PT2S
      GATEWAY_REQUEST_TIMEOUT: PT10S
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  queue-metadata-postgres:
  queue-node-data:
  queue-node-2-data:
  queue-node-3-data:
